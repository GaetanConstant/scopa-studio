            "acceptedAnswer": {
                "@type": "Answer",
                "text": "Au 41 rue Paul Verlaine, 69100 Villeurbanne, en plein cœur du quartier Gratte-Ciel. Le tram T6 s'arrête à deux pas, et le métro A dessert le quartier."
            }
        },
        {
            "@type": "Question",
            "name": "Combien coûte la location de la salle de réunion ?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "100€ HT la demi-journée, matin (9h — 13h) ou après-midi (14h — 18h). La salle accueille jusqu'à 8 personnes et dispose d'un grand écran ainsi que d'un équipement audio pour la visioconférence. Journée complète sur demande."
            }
        },
        {
            "@type": "Question",
            "name": "Peut-on louer la salle de réunion sans être coworker ?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "Oui. La salle est ouverte à tous, que vous soyez résident de Scopa Studio ou non. Écrivez-nous à studio@scopa.co avec la date et le créneau souhaités."
            }
        },
        {
            "@type": "Question",
            "name": "Quels sont les tarifs du coworking ?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "300€ HT par mois et par poste sans engagement, 250€ HT avec un engagement de 6 mois, et 800€ HT par mois pour le bureau privatif (jusqu'à 4 personnes). Le tarif s'ajuste selon le nombre de postes et la durée d'engagement."
            }
        },
        {
            "@type": "Question",
            "name": "Y a-t-il un engagement minimum ?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "Non. La formule Standard est sans engagement. L'engagement de 6 mois est une option qui donne accès à un tarif préférentiel."
            }
        },
        {
            "@type": "Question",
            "name": "Qu'est-ce qui est inclus dans l'abonnement ?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "L'accès sécurisé 24h/24 et 7j/7, la connexion fibre, la cuisine équipée, le café et le thé à volonté, les salles d'appels isolées, la climatisation et le ménage hebdomadaire."
            }
        },

            "@type": "Question",
